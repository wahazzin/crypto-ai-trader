name: crypto_ai paper trader (v0.2)

# STATUS: LIVE (paper) since the lock on 2026-10-07T06:38Z. The 24/7 scanning runs in crypto_ai_loop.yml;
# this workflow is for manual actions (smoke, report, screen, backtest, probes).
# The 12-month clock runs from the lock. Rule changes need an amendment (crypto_ai/lock.py --amend).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "run = scanner tick (does the 6h cycle when due) | lock = start the experiment clock (ONCE) | report = print report | smoke = pre-lock test with real AI (throwaway state) | screen = universe eligibility screen | backtest = toolbox strategies alone | alpaca_probe = read-only Alpaca account check | weekly_preview = weekly check-in so far | news_* = research R1 stages"
        required: true
        default: "run"
        type: choice
        options: [run, lock, report, smoke, screen, backtest, alpaca_probe, weekly_preview, news_fetch, news_score, news_test]

concurrency:
  # state-writing actions share the loop's group (never two writers); research actions run freely
  group: ${{ (github.event.inputs.action == 'run' || github.event.inputs.action == 'lock') && 'crypto-ai-state' || format('crypto-ai-other-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.action == 'news_score' && 340 || 60 }}
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5
        with:
          path: code

      - name: Checkout or create state branch
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" crypto-ai-data >/dev/null 2>&1; then
            git clone --depth 1 --branch crypto-ai-data "$url" state
          else
            mkdir state && cd state && git init -q && git checkout -q -b crypto-ai-data
            git remote add origin "$url"
            echo "# crypto_ai experiment state (written by GitHub Actions, do not edit by hand)" > README.md
          fi

      - name: Restore earlier research outputs (research actions)
        if: startsWith(github.event.inputs.action, 'news_')
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" crypto-ai-research >/dev/null 2>&1; then
            git clone -q --depth 1 --branch crypto-ai-research "$url" prev
            mkdir -p code/research/out && cp -r prev/* code/research/out/ 2>/dev/null || true
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r code/requirements.txt
          if [ "${{ github.event.inputs.action }}" = "news_score" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers
          fi

      - name: Execute
        working-directory: code
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          case "${{ github.event.inputs.action || 'run' }}" in
            lock)   python -m crypto_ai.lock --create --state-dir ../state ;;
            report) python -m crypto_ai.analytics.report --state-dir ../state ;;
            smoke)  # 1) scheduled cycle with the real AI  2) force a wake-up: pretend a held coin
                    # crossed its exit level, so the event path is tested with the real AI too
                    python -m crypto_ai.scanner --state-dir ../smoke --smoke
                    python -m crypto_ai.inspect_state --state-dir ../smoke || true
                    python research/force_wake.py ../smoke
                    python -m crypto_ai.scanner --state-dir ../smoke --smoke ;;
            screen)   python -m research.universe_screen ;;
            backtest) python -m research.backtest_toolbox ;;
            alpaca_probe) python -m research.alpaca_probe ;;
            news_fetch) python -m research.news_r1 fetch ;;
            news_score) python -m research.news_r1 score ;;
            news_test)  python -m research.news_r1 test ;;
            weekly_preview) python -m crypto_ai.analytics.weekly --state-dir ../state --preview research/out/weekly_preview.md ;;
            *)      python -m crypto_ai.scanner --state-dir ../state ;;
          esac

      - name: Save smoke output (separate branch, never mixed with experiment state)
        if: always() && github.event.inputs.action == 'smoke'
        run: |
          [ -d smoke ] || exit 0
          cd smoke && git init -q && git checkout -q -b crypto-ai-smoke
          git config user.name "crypto-ai-bot"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "smoke test $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" crypto-ai-smoke

      - name: Save research output (separate branch, keeps earlier results)
        if: always() && (github.event.inputs.action == 'screen' || github.event.inputs.action == 'backtest' || github.event.inputs.action == 'alpaca_probe' || github.event.inputs.action == 'weekly_preview' || startsWith(github.event.inputs.action, 'news_'))
        run: |
          [ -d code/research/out ] || exit 0
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" crypto-ai-research >/dev/null 2>&1; then
            git clone -q --depth 1 --branch crypto-ai-research "$url" res
          else
            mkdir res && cd res && git init -q && git checkout -q -b crypto-ai-research && git remote add origin "$url" && cd ..
          fi
          cp -r code/research/out/* res/ && cd res
          git config user.name "crypto-ai-bot"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "${{ github.event.inputs.action }} $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin crypto-ai-research

      - name: Commit state
        if: always() && github.event.inputs.action != 'smoke' && github.event.inputs.action != 'screen' && github.event.inputs.action != 'backtest' && github.event.inputs.action != 'alpaca_probe' && github.event.inputs.action != 'weekly_preview' && !startsWith(github.event.inputs.action, 'news_')
        working-directory: state
        run: |
          git config user.name "crypto-ai-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -q -m "crypto_ai state: ${{ github.event.inputs.action || 'run' }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin crypto-ai-data
