name: crypto_ai paper trader (v0.1)

# STATUS: manual-trigger only. The 5-minute schedule is deliberately NOT enabled until:
#   1. the owner confirms the flagged (⚑) items in crypto_ai/PREREGISTRATION.md
#   2. the GROQ_API_KEY repo secret exists (free, no card; OPENROUTER_API_KEY optional backup)
#   3. the lock has been created (run this workflow with action = lock)
# Then uncomment the `schedule:` block below. Enabling it earlier would fail every run with
# LOCK_MISMATCH by design.
#
# State (journal, portfolios, theses, lock) lives on the separate `crypto-ai-data` branch so
# main's history stays clean and your own pushes never conflict with the bot's commits.

on:
  # schedule:
  #   - cron: "*/5 * * * *"   # every 5 min: runs the 6h cycle when due, otherwise a free code scan
  workflow_dispatch:
    inputs:
      action:
        description: "run = scanner tick (does the 6h cycle when due) | lock = start the experiment clock (ONCE) | report = print report | smoke = pre-lock test with real AI (throwaway state) | screen = universe eligibility screen"
        required: true
        default: "run"
        type: choice
        options: [run, lock, report, smoke, screen]

concurrency:
  group: crypto-ai-state          # never two runs writing state at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v5
        with:
          path: code

      - name: Checkout or create state branch
        run: |
          set -e
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" crypto-ai-data >/dev/null 2>&1; then
            git clone --depth 1 --branch crypto-ai-data "$url" state
          else
            mkdir state && cd state && git init -q && git checkout -q -b crypto-ai-data
            git remote add origin "$url"
            echo "# crypto_ai experiment state (written by GitHub Actions, do not edit by hand)" > README.md
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r code/requirements.txt

      - name: Execute
        working-directory: code
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          case "${{ github.event.inputs.action || 'run' }}" in
            lock)   python -m crypto_ai.lock --create --state-dir ../state ;;
            report) python -m crypto_ai.analytics.report --state-dir ../state ;;
            smoke)  # 1) scheduled cycle with the real AI  2) force a wake-up: pretend a held coin
                    # crossed its exit level, so the event path is tested with the real AI too
                    python -m crypto_ai.scanner --state-dir ../smoke --smoke
                    python -m crypto_ai.inspect_state --state-dir ../smoke || true
                    python -c "import json;p='../smoke/theses.json';t=json.load(open(p));[v.update(exit_below=1e12) for v in t.values()];json.dump(t,open(p,'w'))"
                    python -m crypto_ai.scanner --state-dir ../smoke --smoke ;;
            screen) python -m research.universe_screen ;;
            *)      python -m crypto_ai.scanner --state-dir ../state ;;
          esac

      - name: Save smoke output (separate branch, never mixed with experiment state)
        if: always() && github.event.inputs.action == 'smoke'
        run: |
          [ -d smoke ] || exit 0
          cd smoke && git init -q && git checkout -q -b crypto-ai-smoke
          git config user.name "crypto-ai-bot"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "smoke test $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" crypto-ai-smoke

      - name: Save research output (separate branch)
        if: always() && github.event.inputs.action == 'screen'
        run: |
          [ -d code/research/out ] || exit 0
          mkdir res && cp -r code/research/out/* res/ && cd res && git init -q && git checkout -q -b crypto-ai-research
          git config user.name "crypto-ai-bot"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "universe screen $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" crypto-ai-research

      - name: Commit state
        if: always() && github.event.inputs.action != 'smoke' && github.event.inputs.action != 'screen'
        working-directory: state
        run: |
          git config user.name "crypto-ai-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -q -m "crypto_ai state: ${{ github.event.inputs.action || 'run' }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin crypto-ai-data
