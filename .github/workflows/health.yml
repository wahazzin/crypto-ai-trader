name: health check (crypto AI trader -> Discord)

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, test, message]
        default: check
      text:
        required: false

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TEXT: ${{ github.event.inputs.text }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/health_check.py ${{ github.event.inputs.action || 'check' }}
